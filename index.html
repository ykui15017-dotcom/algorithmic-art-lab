<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="生成艺术作品档案">
  <title>生成艺术档案</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f7f8;
      --ink: #26343f;
      --muted: #73818c;
      --line: #ccd5dc;
      --blue-grey: #607b8c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Helvetica Neue", "Noto Sans SC", Arial, sans-serif;
    }

    main {
      width: min(1080px, calc(100% - 48px));
      margin: 0 auto;
      padding: 72px 0 96px;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.15rem, 2vw, 1.5rem);
      font-weight: 500;
      letter-spacing: .16em;
    }

    .catalogue {
      color: var(--muted);
      font: 500 .68rem/1 monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .works {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 420px));
      gap: 32px;
      padding-top: 48px;
    }

    .work-card {
      display: block;
      color: inherit;
      text-decoration: none;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .56);
      transition: border-color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
    }

    .work-card:hover,
    .work-card:focus-visible {
      border-color: var(--blue-grey);
      box-shadow: 0 14px 34px rgba(57, 76, 89, .09);
      transform: translateY(-3px);
      outline: none;
    }

    .specimen {
      position: relative;
      height: 250px;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(90deg, transparent 49.8%, rgba(113, 134, 148, .18) 50%, transparent 50.2%),
        linear-gradient(#eef2f4, #e7edf0);
    }

    .specimen::before {
      content: "";
      position: absolute;
      top: 34px;
      left: 50%;
      width: 90px;
      height: 176px;
      border: 1px solid rgba(83, 111, 128, .45);
      border-radius: 52% 48% 43% 57% / 19% 21% 79% 81%;
      background: linear-gradient(165deg, rgba(255,255,255,.7), rgba(113,139,154,.2));
      box-shadow: 12px 20px 36px rgba(61, 83, 96, .13);
      transform: translateX(-50%) rotate(4deg);
    }

    .specimen::after {
      content: "ARCHIVE · 001";
      position: absolute;
      right: 16px;
      bottom: 14px;
      color: var(--muted);
      font: .61rem/1 monospace;
      letter-spacing: .12em;
    }

    .card-details { padding: 24px; }

    h2 {
      margin: 0 0 9px;
      font-family: Georgia, "Noto Serif SC", serif;
      font-size: 1.35rem;
      font-weight: 400;
      letter-spacing: .025em;
    }

    .title-cn {
      margin-left: .45em;
      color: var(--blue-grey);
      font-size: .85em;
    }

    .meta {
      margin: 0;
      color: var(--muted);
      font: .68rem/1.6 monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    @media (max-width: 540px) {
      main { width: min(100% - 28px, 1080px); padding-top: 40px; }
      header { align-items: flex-start; flex-direction: column; }
      .works { padding-top: 28px; }
      .specimen { height: 220px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>生成艺术档案</h1>
      <span class="catalogue">Generative Art Archive</span>
    </header>

    <section class="works" aria-label="作品列表">
      <a class="work-card" href="works/still-descent/" aria-label="查看作品 Still Descent / 静沉标本">
        <div class="specimen" aria-hidden="true"></div>
        <div class="card-details">
          <h2>Still Descent <span class="title-cn">静沉标本</span></h2>
          <p class="meta">Generative study · No. 001</p>
        </div>
      </a>
    </section>
  </main>
</body>
</html>
